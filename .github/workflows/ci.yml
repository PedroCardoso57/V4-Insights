name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, typecheck, testes, migrations)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: v4
          POSTGRES_PASSWORD: v4
          POSTGRES_DB: v4insights_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U v4" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://v4:v4@localhost:5432/v4insights_test
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --python 3.12
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy app
      - name: Testes (unit + integração, inclui migrations em base limpa e baseline)
        run: uv run pytest --cov=app --cov-report=term-missing
      - name: OpenAPI sincronizado com o cliente do frontend
        env:
          ENCRYPTION_KEY: ZmFrZS1jaS1rZXktMDEyMzQ1Njc4OWFiY2RlZjAxMjM=
          GOOGLE_OIDC_CLIENT_ID: ci
          GOOGLE_OIDC_CLIENT_SECRET: ci
        run: |
          uv run python -m app.cli openapi --out ../frontend/openapi.json
          git diff --exit-code -- ../frontend/openapi.json || {
            echo "::error::frontend/openapi.json desatualizado. Rode 'python -m app.cli openapi --out ../frontend/openapi.json' e 'npm run gen:api'."; exit 1; }
      - name: Verificação de migrations
        env:
          ENCRYPTION_KEY: ZmFrZS1jaS1rZXktMDEyMzQ1Njc4OWFiY2RlZjAxMjM=
          GOOGLE_OIDC_CLIENT_ID: ci
          GOOGLE_OIDC_CLIENT_SECRET: ci
        run: |
          psql postgresql://v4:v4@localhost:5432/v4insights_test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          uv run python -m app.db.migrate    # base limpa
          uv run python -m app.db.migrate    # repetição é no-op
          uv run alembic check               # modelos e migrations em sincronia
          uv run alembic downgrade base      # rollback completo
          uv run alembic upgrade head

  frontend:
    name: Frontend (lint, typecheck, testes, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Cliente TypeScript gerado do OpenAPI está atualizado
        run: npm run gen:api && git diff --exit-code -- src/services/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Nenhuma credencial no bundle
        run: npm run check:bundle
      - name: E2E (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  docker:
    name: Build das imagens
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose build
