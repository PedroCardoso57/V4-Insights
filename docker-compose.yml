name: v4-insights

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-backend: &backend
  logging: *logging
  build:
    context: ./backend
  image: v4-insights-api:${APP_VERSION:-local}
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    REPORTS_STORAGE_DIR: /var/lib/v4insights/relatorios
  restart: unless-stopped
  networks: [interna]

services:
  postgres:
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [interna]
    # Sem "ports": banco não é exposto fora da rede interna.

  redis:
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [interna]

  migrate:
    <<: *backend
    # Aplica migrations em base limpa ou registra a baseline SQL já aplicada (sem reaplicar).
    command: ["python", "-m", "app.db.migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m
    <<: *backend
    volumes:
      - relatorios:/var/lib/v4insights/relatorios
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    <<: *backend
    # Celery com beat embutido (-B): mantenha UMA réplica deste serviço.
    command: ["sh", "-c", "exec celery -A app.workers.celery_app worker -B --loglevel INFO --concurrency $${WORKER_CONCURRENCY:-2}"]
    volumes:
      - relatorios:/var/lib/v4insights/relatorios
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME -t 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

  frontend:
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    build:
      context: ./frontend
    image: v4-insights-web:${APP_VERSION:-local}
    restart: unless-stopped
    networks: [interna]

  proxy:
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    image: caddy:2.8-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/health/live"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks: [interna]

volumes:
  pgdata:
  redisdata:
  relatorios:
  caddydata:
  caddyconfig:

networks:
  interna:
